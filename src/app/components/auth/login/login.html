<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <img src="AMTKD.ico" alt="AMTKD Logo" width="72" height="72" style="border-radius: 14px;">
      </div>
      <h1>Sistema de Pagos AMTKD</h1>
      <span class="sedes-badge">Sedes: Progreso y Morelos</span>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      @if (errorMsg) {
        <div class="alert alert-error">{{ errorMsg }}</div>
      }

      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Ingresa tu usuario" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" placeholder="Ingresa tu contraseña" />
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword" tabindex="-1">
            @if (showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading || cooldown">
        @if (loading) {
          <span class="spinner"></span> Ingresando...
        } @else if (cooldown) {
          Espera {{ cooldownSeconds }}s...
        } @else {
          Ingresar al Sistema
        }
      </button>

      <div class="auth-links">
        <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</div>

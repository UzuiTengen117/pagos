<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <img src="AMTKD.ico" alt="AMTKD Logo" width="72" height="72" style="border-radius: 14px;">
      </div>
      <h1>Sistema de Pagos AMTKD</h1>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      @if (errorMsg) {
        <div class="alert alert-error">{{ errorMsg }}</div>
      }

      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Ingresa tu usuario" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Ingresa tu contraseña" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
        @if (loading) {
          <span class="spinner"></span> Ingresando...
        } @else {
          Ingresar al Sistema
        }
      </button>
    </form>
  </div>
</div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="#4f46e5"/>
          <path d="M14 24h20M24 14v20M14 14l20 20M34 14L14 34" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Crear Cuenta</h1>
      <p>Regístrate para acceder al sistema</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      @if (errorMsg) {
        <div class="alert alert-error">{{ errorMsg }}</div>
      }
      @if (successMsg) {
        <div class="alert alert-success">{{ successMsg }}</div>
      }

      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" />
        </div>
      </div>

      <div class="form-row two-col">
        <div class="form-group">
          <label for="primerApellido">Primer apellido</label>
          <input type="text" id="primerApellido" [(ngModel)]="primerApellido" name="primerApellido" placeholder="Primer apellido" />
        </div>
        <div class="form-group">
          <label for="segundoApellido">Segundo apellido</label>
          <input type="text" id="segundoApellido" [(ngModel)]="segundoApellido" name="segundoApellido" placeholder="Segundo apellido" />
        </div>
      </div>

      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Elige un usuario" />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
      </div>

      <div class="form-row two-col">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Contraseña" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Crear Cuenta</button>

      <div class="auth-links">
        <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
      </div>
    </form>
  </div>
</div>

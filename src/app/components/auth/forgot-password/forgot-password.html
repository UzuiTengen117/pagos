<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <img src="AMTKD.ico" alt="AMTKD Logo" width="72" height="72" style="border-radius: 14px;">
      </div>
      <h1>Recuperar Contraseña</h1>
      <p>Responde tu pregunta de seguridad para restablecerla</p>
    </div>

    @if (successMsg) {
      <div class="alert alert-success">{{ successMsg }}</div>
    } @else {
      @if (errorMsg) {
        <div class="alert alert-error">{{ errorMsg }}</div>
      }

      @if (step === 1) {
        <form (ngSubmit)="buscarPregunta()" class="auth-form">
          <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Ingresa tu usuario" class="input-plain" />
          </div>

          <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
            @if (loading) {
              <span class="spinner"></span> Buscando...
            } @else {
              Continuar
            }
          </button>
        </form>
      } @else {
        <div class="question-box">
          <p class="question-label">Pregunta de seguridad</p>
          <p class="question-text">{{ pregunta }}</p>
        </div>

        <form (ngSubmit)="restablecer()" class="auth-form">
          <div class="form-group">
            <label for="respuesta">Tu respuesta</label>
            <input type="text" id="respuesta" [(ngModel)]="respuesta" name="respuesta" placeholder="Escribe tu respuesta" class="input-plain" />
          </div>

          <div class="form-group">
            <label for="newPassword">Nueva contraseña</label>
            <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" placeholder="Mínimo 6 caracteres" class="input-plain" />
          </div>

          <div class="form-group">
            <label for="confirmNewPassword">Confirmar nueva contraseña</label>
            <input type="password" id="confirmNewPassword" [(ngModel)]="confirmNewPassword" name="confirmNewPassword" placeholder="Repite la nueva contraseña" class="input-plain" />
          </div>

          <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
            @if (loading) {
              <span class="spinner"></span> Restableciendo...
            } @else {
              Restablecer contraseña
            }
          </button>
        </form>
      }

      <div class="auth-links">
        <a routerLink="/login">Volver al inicio de sesión</a>
      </div>
    }
  </div>
</div>
